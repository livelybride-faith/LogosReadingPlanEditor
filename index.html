<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logos Plan Editor</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eceff1; padding: 20px; line-height: 1.4; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 1400px; margin: auto; }
        h2 { color: #2c3e50; margin-top: 0; display: flex; align-items: center; justify-content: space-between; }
        .version { font-size: 12px; color: #95a5a6; font-weight: normal; }
        
        .io-container { display: flex; gap: 20px; margin-bottom: 20px; }
        .io-box { flex: 1; display: flex; flex-direction: column; }
        label { font-size: 11px; font-weight: 700; color: #7f8c8d; margin-bottom: 5px; text-transform: uppercase; }
        textarea { width: 100%; height: 160px; border: 1px solid #cfd8dc; border-radius: 6px; padding: 10px; font-family: 'Courier New', monospace; box-sizing: border-box; font-size: 12px; }
        #jsonOutput { background-color: #f0f4f8; color: #2980b9; word-break: break-all; }

        .toolbar { margin-bottom: 20px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 20px; flex-wrap: wrap; }
        
        .table-container { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; background: white; min-width: 1000px; }
        th { background: #f8f9fa; color: #546e7a; font-weight: 600; text-transform: uppercase; font-size: 10px; padding: 12px; border-bottom: 2px solid #eee; text-align: left; }
        td { padding: 6px; border-bottom: 1px solid #f0f0f0; }
        input { border: 1px solid #dfe6e9; padding: 8px; border-radius: 4px; width: 100%; box-sizing: border-box; font-family: monospace; font-size: 12px; min-width:150px; }
        input:focus { border-color: #3498db; outline: none; background: #f7fbff; }
        
        .btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; font-size: 13px; }
        .btn-primary { background: #3498db; color: white; }
        .btn-success { background: #27ae60; color: white; }
        .btn-add { background: #8e44ad; color: white; }
        .btn-danger { background: #e74c3c; color: white; padding: 5px 8px; font-size: 10px; }
        .btn-update { background: #f39c12; color: white; font-size: 10px; padding: 6px; width: 100%; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .id-label { display: block; font-size: 9px; color: #95a5a6; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
        .key-tag { font-size: 8px; background: #eee; padding: 2px 4px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }
        
        footer { margin-top: 30px; font-size: 11px; color: #95a5a6; text-align: center; border-top: 1px solid #cfd8dc; padding-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2>
        Logos Reading Plan Editor 
        <span class="version">Universal Format Support • v1.1.0</span>
    </h2>
    
    <div class="io-container">
        <div class="io-box">
            <label>Original JSON Input</label>
            <textarea id="jsonInput" placeholder="Paste your Logos reading plan JSON array here..."></textarea>
        </div>
        <div class="io-box">
            <label>Updated JSON (Compressed for Export)</label>
            <textarea id="jsonOutput" readonly placeholder="Compressed result will appear here..."></textarea>
        </div>
    </div>
    
    <div class="toolbar">
        <button class="btn btn-primary" onclick="loadData()">Load Data</button>
        <button class="btn btn-add" onclick="addNewDay()">+ Add New Day</button>
        <button class="btn btn-success" onclick="copyResult()">Copy Compressed JSON</button>
    </div>

    <div class="table-container">
        <table id="readingTable" style="display:none;">
            <thead>
                <tr id="headerRow">
                    <th style="width: 130px;">Date</th>
                    <th style="width: 80px;">Auto-Fill</th>
                    <th style="width: 40px;">Del</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <footer>
        <strong>Pro Tip:</strong> Use the "Update" button to auto-increment dates and numbers (Page/Article IDs) for all following days.
    </footer>
</div>

<script>
let planData = [];

// Helper: Identify which key holds the location value (reference, textRange, contentsEntry)
const getValueKey = (resObj) => {
    const keys = Object.keys(resObj);
    return keys.find(k => k !== 'resourceId') || 'reference';
};

// Helper: Increment numbers found at the end of strings (e.g., page.88 -> page.89)
const incrementString = (str) => {
    return str.replace(/(\d+)(?!.*\d)/, (match) => {
        return parseInt(match) + 1;
    });
};

function updateOutputBox() {
    document.getElementById('jsonOutput').value = JSON.stringify(planData);
}

function loadData() {
    try {
        let raw = document.getElementById('jsonInput').value.trim();
        // Handle cases where user pastes just the objects without outer brackets
        if (raw.startsWith('{') && !raw.startsWith('[')) raw = '[' + raw + ']';
        
        planData = JSON.parse(raw);
        if (Array.isArray(planData)) {
            setupHeaders();
            renderTable();
            updateOutputBox();
            document.getElementById('readingTable').style.display = 'table';
        }
    } catch (e) {
        alert("Invalid JSON format. Make sure it's a valid Array of days.");
    }
}

function setupHeaders() {
    const headerRow = document.getElementById('headerRow');
    while (headerRow.children.length > 3) headerRow.removeChild(headerRow.children[1]);
    
    const resources = planData[0].readings[0];
    resources.forEach((res, i) => {
        const keyName = getValueKey(res);
        const th = document.createElement('th');
        th.innerHTML = `<span class="id-label">${res.resourceId}</span><span class="key-tag">${keyName}</span>Res ${i+1}`;
        headerRow.insertBefore(th, headerRow.lastElementChild.previousElementSibling);
    });
}

function renderTable() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    planData.forEach((day, index) => {
        const tr = document.createElement('tr');
        
        // Date
        const dateTd = document.createElement('td');
        dateTd.innerHTML = `<input type="text" value="${day.date}" onchange="updateVal(${index}, 'date', this.value)">`;
        tr.appendChild(dateTd);
        
        // Resources
        day.readings[0].forEach((res, resIdx) => {
            const keyName = getValueKey(res);
            const val = res[keyName] || "";
            const td = document.createElement('td');
            td.innerHTML = `<input type="text" id="p-${index}-${resIdx}" value="${val}" onchange="updateResource(${index}, ${resIdx}, '${keyName}', this.value)">`;
            tr.appendChild(td);
        });

        // Auto-Fill Button
        const actionTd = document.createElement('td');
        actionTd.innerHTML = `<button class="btn btn-update" onclick="propagate(${index})">Update</button>`;
        tr.appendChild(actionTd);

        // Delete
        const delTd = document.createElement('td');
        delTd.innerHTML = `<button class="btn btn-danger" onclick="removeDay(${index})">×</button>`;
        tr.appendChild(delTd);
        
        tbody.appendChild(tr);
    });
}

function updateVal(idx, key, val) { 
    planData[idx][key] = val; 
    updateOutputBox();
}

function updateResource(dayIdx, resIdx, key, val) { 
    planData[dayIdx].readings[0][resIdx][key] = val; 
    updateOutputBox();
}

function propagate(startIndex) {
    for (let i = startIndex + 1; i < planData.length; i++) {
        // Increment Date
        let d = new Date(planData[i-1].date + "T12:00:00");
        d.setDate(d.getDate() + 1);
        const newDate = d.toISOString().split('T')[0];
        planData[i].date = newDate;

        // Increment Values for each resource
        planData[i].readings[0].forEach((res, resIdx) => {
            const keyName = getValueKey(res);
            const prevVal = planData[i-1].readings[0][resIdx][keyName];
            planData[i].readings[0][resIdx][keyName] = incrementString(prevVal);
        });
    }
    renderTable();
    updateOutputBox();
}

function addNewDay() {
    if (planData.length === 0) return;
    const lastDay = planData[planData.length - 1];
    let d = new Date(lastDay.date + "T12:00:00");
    d.setDate(d.getDate() + 1);
    
    const newReadings = [lastDay.readings[0].map(res => {
        const keyName = getValueKey(res);
        const newRes = { resourceId: res.resourceId };
        newRes[keyName] = incrementString(res[keyName]);
        return newRes;
    })];

    planData.push({ date: d.toISOString().split('T')[0], readings: newReadings });
    renderTable();
    updateOutputBox();
}

function removeDay(index) {
    if(confirm("Remove this day?")) {
        planData.splice(index, 1);
        renderTable();
        updateOutputBox();
    }
}

function copyResult() {
    const copyText = document.getElementById("jsonOutput");
    copyText.select();
    document.execCommand("copy");
    alert("Copied to clipboard!");
}
</script>
</body>
</html>
